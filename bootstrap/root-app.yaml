apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/macinsight/kubernetes.git
    targetRevision: main
    path: clusters/k3s
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
